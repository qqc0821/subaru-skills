<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加载过程与脚本耗时</title><style>
:root{--bg:#faf9f5;--ink:#232b28;--muted:#626b65;--line:#dddfd7;--green:#26745c;--soft:#e3ede4;--orange:#ad4e29;--sand:#f1e8dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:30px 52px 70px}header{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:20px;font-size:13px}a{color:var(--green);text-underline-offset:4px}h1{font-size:clamp(30px,4.5vw,48px);line-height:1.25;letter-spacing:-.035em;margin:44px 0 16px;font-weight:650}h2{font-size:25px;line-height:1.35;margin:0}h3{font-size:17px;margin:0 0 8px}p{margin:8px 0}.intro{max-width:700px;font-size:17px;color:var(--muted)}.muted,small{color:var(--muted)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:4px}button:disabled{opacity:.5;cursor:default}::selection{background:#d8e8d6}*{scrollbar-color:#b0baad var(--bg);scrollbar-width:thin}input{accent-color:var(--green);caret-color:var(--green)}.story{margin-top:40px;padding-bottom:40px;border-bottom:1px solid var(--line)}.chapter-head{display:flex;justify-content:space-between;gap:18px;align-items:baseline}.chapter-head p{font-size:13px;color:var(--muted)}.timeline{margin:30px 0 26px;padding:0 8px}.ruler{height:120px;position:relative;border-bottom:1px solid #8f9c91}.track{position:absolute;top:55px;height:22px;left:0;right:0;background:#eceee7}.work{position:absolute;top:0;height:22px;background:#739582;min-width:1px}.marker{position:absolute;bottom:0;height:104px;border-left:1px solid #87988a}.marker strong{position:absolute;top:0;white-space:nowrap;font-size:12px;font-weight:500;transform:translateX(-50%);background:var(--bg);padding:0 5px}.marker.end{border-color:var(--green)}.marker.end strong{transform:translateX(-100%);color:var(--green);font-weight:650}.tick{white-space:nowrap;position:absolute;bottom:-27px;font-size:12px;color:var(--muted);transform:translateX(-50%)}.event{position:absolute;top:53px;height:26px;border:0;border-radius:2px;background:var(--orange);min-width:8px;padding:0;z-index:2}.event:hover{outline:3px solid #e5b392}.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;margin-top:38px;color:var(--muted)}.key{display:inline-block;width:18px;height:8px;background:#739582;margin-right:7px}.key.warm{background:var(--orange)}.milestones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px;margin-top:32px}.milestones article{padding-top:16px;border-top:1px solid var(--line)}.time{font-size:23px;font-variant-numeric:tabular-nums;margin:0 0 8px}.milestones p:not(.time){font-size:13px;color:var(--muted)}.textbutton{padding:0;border:0;background:none;color:var(--green);font-size:13px;text-decoration:underline;text-underline-offset:4px}.event-proof{margin-top:24px;background:#f0eee6;padding:22px 26px}.event-proof[hidden]{display:none}.proof-head{display:flex;justify-content:space-between;gap:15px}.close{background:none;border:1px solid #bfc6ba;border-radius:5px;font-size:12px;padding:4px 10px}.proof-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:16px 0}.proof-grid strong{display:block;overflow-wrap:anywhere;font-size:13px}.proof-grid span{font-size:20px}.proof-note{font-size:12px;color:var(--muted)}.ledger{padding-top:38px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0 18px}select,input[type=search]{background:transparent;border:1px solid #cbd0c5;border-radius:5px;padding:8px 12px;font-size:13px}input[type=search]{width:260px}.controls label{font-size:13px}.ledger-summary{font-size:13px;color:var(--muted);margin-bottom:22px}.ledger-head{display:grid;grid-template-columns:minmax(180px,1fr) 44% 85px;gap:20px;font-size:12px;color:var(--muted);padding-bottom:9px}.ledger-head span:last-child{text-align:right}.entry{border-top:1px solid var(--line)}.entry>summary{display:grid;grid-template-columns:minmax(180px,1fr) 44% 85px;gap:20px;align-items:center;padding:20px 0;cursor:pointer;list-style:none}.entry>summary::-webkit-details-marker{display:none}.entry>summary:hover .name{color:var(--green)}.entry[open] .name{color:var(--green)}.name{font-size:14px;font-weight:600;overflow-wrap:anywhere}.domain{display:block;font-size:11px;font-weight:400;color:var(--muted);overflow-wrap:anywhere}.bar{height:18px;background:#ecefe6;position:relative}.bar i{display:block;height:100%;background:var(--green);min-width:1px}.value{text-align:right;font-size:16px;font-variant-numeric:tabular-nums}.value small{display:block;font-size:11px}.entry-body{padding:4px 0 24px}.url{font-size:12px;overflow-wrap:anywhere;color:var(--muted);margin-bottom:12px}.tasks{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.taskchip{padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:4px;font-size:12px}.taskchip:hover,.taskchip[aria-pressed=true]{background:var(--soft);border-color:#5d8e74}.inline-proof{padding:16px 20px;background:#f0f2e9;margin-top:12px}.inline-proof .proof-grid{margin-bottom:8px}.unknown{margin:24px 0;padding:16px 0;border-top:1px dashed #a8b1a3;border-bottom:1px dashed #a8b1a3;font-size:13px}.more{display:block;background:none;border:1px solid #a9b8a7;padding:9px 18px;border-radius:5px;margin:22px auto;color:var(--green);font-size:13px}.empty{padding:30px 0;color:var(--muted)}footer{border-top:1px solid var(--line);margin-top:42px;padding-top:18px;font-size:12px;color:var(--muted);max-width:85ch}@media(max-width:650px){main{padding:22px 20px 45px}header{font-size:11px}h1{margin-top:32px}.chapter-head{display:block}.milestones{grid-template-columns:1fr;gap:16px}.milestones article{padding-top:12px}.milestones .time{font-size:20px}.ledger-head{display:none}.entry>summary{grid-template-columns:minmax(0,1fr) 75px;gap:12px}.entry>summary .bar{grid-column:1/-1;grid-row:2;height:9px}.value{grid-column:2;grid-row:1}.proof-grid{grid-template-columns:1fr;gap:12px}.proof-grid div{display:flex;justify-content:space-between;gap:12px}.proof-grid strong{max-width:75%}.proof-grid span{font-size:16px}.event-proof{padding:18px}.marker strong{font-size:10px}.controls input{width:100%}}
</style><main><header><strong id="site"></strong><span>主线程性能报告</span></header><h1 id="headline"></h1><p class="intro">先沿时间看加载过程，再向下追踪脚本占用。所有视图来自同一次录制，点开一处，就在原地查看证据。</p><section class="story"><div class="chapter-head"><h2>加载过程</h2><p>完整展示当前加载区间 · 时间从 0 开始</p></div><div class="timeline" id="timeline"></div><div class="milestones" id="milestones"></div><div class="event-proof" id="eventproof" hidden></div></section><section class="ledger"><div class="chapter-head"><h2>时间花在哪些脚本上</h2><p>展开文件，查看它关联的任务</p></div><div class="controls"><label>查看范围 <select id="scope"><option value="pre">LCP 之前</option><option value="all">完整录制</option></select></label><input type="search" id="search" aria-label="搜索文件或域名" placeholder="搜索文件或域名"></div><p class="ledger-summary" id="ledger-summary"></p><div class="ledger-head"><span>文件 / 来源</span><span>当前范围内的关联占用</span><span>耗时</span></div><div id="entries"></div><button class="more" id="more">展开全部文件</button><div class="unknown" id="unknown"></div></section><footer>本报告基于一次录制；LCP 优先取同次 Performance API 快照，否则使用 trace 候选时间。设备、缓存和限速以采集说明为准。仅展示顶层主线程且省略不足 1 ms 的外层任务。脚本关联含其包围的布局与样式工作，不等于纯 JavaScript 自耗时，也不构成 LCP 延迟的因果证明。</footer></main><script id="data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.querySelector('#data').textContent),response=D.responseStart??null,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ms=n=>n.toFixed(1),sec=n=>(n/1000).toFixed(2),label=u=>{try{return new URL(u).pathname.split('/').pop()||new URL(u).hostname}catch{return '未归因工作'}},host=u=>{try{return new URL(u).hostname}catch{return ''}};let expanded=false;const end=Math.max(D.lcp??D.duration,0.001),pre=D.tasks.filter(t=>t.start<end),long=pre.filter(t=>t.duration>50),busy=pre.reduce((n,t)=>n+Math.max(0,Math.min(end,t.start+t.duration)-t.start),0),pct=n=>Math.min(100,Math.max(0,n/end*100));
$('#site').textContent=D.url;$('#headline').textContent=D.lcp==null?'这次加载，记录到了什么？':`首屏这 ${sec(D.lcp)} 秒，发生了什么？`;if(D.lcp==null){$('#scope option[value="pre"]').textContent='完整录制（未记录 LCP）'}
function proof(t){return `<div class="proof-head"><h3>${sec(t.start)}–${sec(t.start+t.duration)} 秒 · ${ms(t.duration)} ms</h3></div><p class="proof-note">${D.lcp==null?'未记录 LCP，无法判断先后':t.start>=D.lcp?'发生在 LCP 之后':t.start+t.duration>D.lcp?'跨越 LCP 时刻':'发生在 LCP 之前'}。以下显示该任务中占用最多的三个来源。</p><div class="proof-grid">${t.sources.slice(0,3).map(s=>`<div><strong>${esc(label(s.url))}</strong><span>${ms(s.busy)} ms</span></div>`).join('')}</div><p class="proof-note">任务关联可能包含多个脚本和未归因工作，不能将整个任务归给一个文件。</p>`}
$('#timeline').innerHTML=`<div class="ruler"><div class="track">${pre.map(t=>`<span class="work" style="left:${pct(t.start)}%;width:${pct(Math.min(end,t.start+t.duration))-pct(t.start)}%" title="${sec(t.start)} s · ${ms(t.duration)} ms"></span>`).join('')}</div>${response!=null&&response<=end?`<div class="marker" style="left:${pct(response)}%"><strong>文档首字节 ${sec(response)} s</strong></div>`:''}<div class="marker end" style="left:100%"><strong>${D.lcp==null?'录制结束':'LCP'} ${sec(end)} s</strong></div>${long.map(t=>`<button class="event" data-event="${t.id}" style="left:${pct(t.start)}%;width:${pct(Math.min(end,t.start+t.duration))-pct(t.start)}%" aria-label="查看 ${sec(t.start)} 秒开始的 ${ms(t.duration)} 毫秒长任务" title="点击查看 ${ms(t.duration)} ms 长任务"></button>`).join('')}${[0,1,2,3].filter(n=>n*1000<end*.85).map(n=>`<span class="tick" style="left:${pct(n*1000)}%">${n} s</span>`).join('')}<span class="tick" style="left:100%;transform:translateX(-100%)">${sec(end)} s</span></div><div class="legend"><span><i class="key"></i>已记录的主线程工作</span><span><i class="key warm"></i>长任务，可点击查看</span><span>空白不代表网络空闲</span></div>`;
$('#milestones').innerHTML=`<article><p class="time">${response==null?'未记录':sec(response)+' 秒'}</p><h3>文档首字节到达</h3><p>${response==null?'当前输入缺少可确认的文档首字节时间，不推算等待阶段。':'从导航开始到收到响应首字节。它包含请求链路中的多种耗时，不能全归为服务端处理。'}</p></article><article><p class="time">${sec(busy)} 秒</p><h3>${D.lcp==null?'录制区间':'首屏区间'}的主线程占用</h3><p>分散在 ${pre.length} 个已记录任务中，其中 ${long.length} 个超过 50 ms。</p>${long.length?`<button class="textbutton" data-event="${long[0].id}">展开 ${ms(long[0].duration)} ms 长任务的证据</button>`:''}</article><article><p class="time">${sec(end)} 秒</p><h3>${D.lcp==null?'未记录到 LCP':'最大内容绘制出现'}</h3><p>${D.lcp==null?'展示完整录制中的主线程工作，无法判断与 LCP 的先后关系。':'这是本次记录的 LCP 时刻，不等于整个页面加载结束。'}</p></article>`;
document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{const t=D.tasks.find(t=>t.id===+b.dataset.event);$('#eventproof').hidden=false;$('#eventproof').innerHTML=proof(t)+'<button class="close" id="closeproof">收起证据</button>';$('#closeproof').onclick=()=>$('#eventproof').hidden=true});
function ledger(){const hi=$('#scope').value==='pre'?end:D.duration,groups=new Map();for(const t of D.tasks)for(const s of t.segments){const dur=Math.max(0,Math.min(hi,s.start+s.duration)-Math.max(0,s.start));if(!dur)continue;let g=groups.get(s.url);if(!g){g={url:s.url,busy:0,tasks:new Map()};groups.set(s.url,g)}g.busy+=dur;g.tasks.set(t.id,(g.tasks.get(t.id)||0)+dur)}const q=$('#search').value.toLowerCase(),all=[...groups.values()].filter(g=>g.url&&g.url.toLowerCase().includes(q)).sort((a,b)=>b.busy-a.busy),rows=expanded?all:all.slice(0,8),max=Math.max(1,...all.map(g=>g.busy));$('#ledger-summary').textContent=`0–${sec(hi)} 秒内，按已去重的关联占用排序。横条共用尺度；${all.length} 个匹配文件${expanded?'':'，先展示前 8 个'}。`;
$('#entries').innerHTML=rows.map((g,i)=>`<details class="entry"><summary><span class="name">${esc(label(g.url))}<small class="domain">${esc(host(g.url))}</small></span><span class="bar"><i style="width:${g.busy/max*100}%"></i></span><span class="value">${ms(g.busy)} ms<small>${g.tasks.size} 个任务 · 展开</small></span></summary><div class="entry-body"><p class="url">${esc(g.url)}</p><p class="proof-note">下面按本文件在任务中的区间占用排序；按钮上的毫秒数为本文件贡献。</p><div class="tasks">${[...g.tasks].sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<button class="taskchip" data-task="${id}" data-group="${i}" aria-pressed="false">${sec(D.tasks.find(t=>t.id===id).start)} s · ${ms(n)} ms</button>`).join('')}</div><div id="proof-${i}"></div></div></details>`).join('')||'<p class="empty">没有匹配文件，试试其他名称或域名。</p>';$('#more').hidden=all.length<=8;$('#more').textContent=expanded?'收起，展示前 8 个文件':`展开全部 ${all.length} 个文件`;const unknown=groups.get('');$('#unknown').textContent=`另外有 ${ms(unknown?.busy??0)} ms 未归因工作，保留为独立部分，不分配给附近脚本。`;
document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const box=$('#proof-'+b.dataset.group);b.closest('.tasks').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');box.className='inline-proof';box.innerHTML=proof(D.tasks.find(t=>t.id===+b.dataset.task))})}
$('#scope').onchange=ledger;$('#search').oninput=ledger;$('#more').onclick=()=>{expanded=!expanded;ledger()};ledger();
</script></html>
