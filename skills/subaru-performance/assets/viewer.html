<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主线程分析</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#20332e;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer;background:white;color:inherit;border:1px solid #d9e2dc;border-radius:5px;padding:8px 12px}button:hover{background:#eaf2ed}button.active{background:#203e32;color:white;border-color:#203e32}header{padding:22px 30px;background:white;border-bottom:1px solid #d9e2dc;display:flex;justify-content:space-between;align-items:center}header strong{font-size:20px}header span{color:#718078;font-size:12px}main{max-width:1600px;margin:auto;padding:24px 30px}h1,h2,h3,p{margin:0}h2{font-size:17px}h3{font-size:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid #d9e2dc;border-radius:8px;margin-bottom:18px}.metric{padding:18px 24px;border-right:1px solid #d9e2dc}.metric:last-child{border:0}.label{color:#708078;font-size:12px}.number{font-size:32px;line-height:1.6;font-variant-numeric:tabular-nums}.number small{font-size:13px}.panel{background:#fff;border:1px solid #d9e2dc;border-radius:8px;margin-bottom:18px;overflow:hidden}.head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;gap:12px}.controls{display:flex;gap:6px;flex-wrap:wrap}.legend{display:flex;gap:16px;color:#6a7c72;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}.chart{padding:0 20px 14px}svg{display:block;width:100%;height:105px}.tick{font-size:11px;fill:#708078}.summary{padding:12px 20px;border-top:1px solid #e3e9e5;font-size:13px;background:#f9fbf8;line-height:1.6}.body{display:grid;grid-template-columns:320px minmax(0,1fr)}aside{border-right:1px solid #d9e2dc;padding:18px 0}.asidehead{padding:0 18px 14px;display:flex;justify-content:space-between;align-items:center}.asidehead small{color:#708078}.file{display:block;border:0;border-radius:0;width:100%;text-align:left;padding:13px 18px;border-bottom:1px solid #edf1ee;background:transparent}.file.selected{background:#e9f2ec;box-shadow:inset 3px 0 #277252}.file strong{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file small{display:block;color:#708078;font-size:11px;margin-top:4px}.filefoot{display:flex;justify-content:space-between;margin-top:8px;font-size:12px}.filebar{height:3px;background:#edf0ec;margin-top:8px}.filebar i{display:block;height:3px;background:#bd7654}.filelist{max-height:630px;overflow:auto}.work{min-width:0}.toolbar{display:flex;gap:8px;align-items:center;padding:16px 20px;border-bottom:1px solid #e3e9e5;flex-wrap:wrap}.toolbar input{border:1px solid #d9e2dc;border-radius:5px;padding:8px 10px;width:210px;margin-left:auto}.columns,.task{display:grid;grid-template-columns:110px minmax(120px,1.3fr) minmax(100px,1fr) 75px;gap:12px;align-items:center;padding:0 20px}.columns{font-size:11px;color:#708078;height:37px;background:#fafbf9}.tasks{max-height:360px;overflow-y:auto}.task{height:57px;width:100%;border:0;border-bottom:1px solid #edf1ee;border-radius:0;text-align:left;font-size:12px}.task.selected{background:#f9f0e9}.taskname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.taskname small{display:block;color:#708078;font-size:10px;margin-top:4px}.task .duration{text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}.track{height:25px;position:relative;background:repeating-linear-gradient(90deg,transparent,transparent calc(25% - 1px),#e8eee9 calc(25% - 1px),#e8eee9 25%)}.bar{position:absolute;height:12px;top:7px;background:#b86645;border-radius:2px;min-width:2px}.lcp{position:absolute;width:1px;background:#198260;top:0;bottom:0}.details{border-top:1px solid #d9e2dc;padding:20px;min-height:240px}.detailhead{display:flex;justify-content:space-between;gap:14px}.badge{font-size:11px;background:#eaf1eb;padding:4px 8px;border-radius:3px;white-space:nowrap;height:fit-content}.split{display:flex;height:9px;border-radius:3px;overflow:hidden;margin:16px 0 10px}.facts{display:flex;flex-wrap:wrap;gap:15px;font-size:12px;color:#687c70}.source{padding:12px 0;border-bottom:1px solid #e3e9e5;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.source strong{font-size:13px}.path{font:11px ui-monospace,monospace;color:#718078;overflow-wrap:anywhere;margin-top:5px;line-height:1.6}.sub{font-size:12px;color:#718078;line-height:1.7;margin-top:7px}.empty{padding:35px 20px;text-align:center;color:#718078;line-height:1.8}.lcpstrip{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:16px 20px}.lcpstrip div{flex:1;min-width:170px}.lcpstrip strong{display:block;margin-top:6px;font-size:19px;font-weight:500}.caption{color:#718078;font-size:11px;padding:0 20px 14px;line-height:1.6}button:focus-visible,input:focus-visible{outline:2px solid #198260;outline-offset:2px}@media(max-width:1000px){.body{grid-template-columns:250px 1fr}.columns,.task{grid-template-columns:90px minmax(100px,1fr) 80px;gap:8px}.columns .timecolumn,.task .track{display:none}.metric{padding:16px}.number{font-size:27px}}@media(max-width:700px){main{padding:16px}header{padding:18px}header span{display:none}.metrics{grid-template-columns:1fr 1fr}.body{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd}.filelist{max-height:230px}.head{align-items:flex-start;flex-direction:column}.legend{flex-wrap:wrap}.toolbar input{margin:0;width:100%}}
</style></head><body><header><strong>加载透视 <span> / 主线程分析</span></strong><span><span id="site"></span></span></header><main><section class="metrics" id="metrics"></section><section class="panel"><div class="head"><h2>主线程在忙什么</h2><div class="controls"><button id="all" class="active">完整过程</button><button id="before">LCP 之前</button></div><div class="legend"><span><i class="dot" style="background:#bd8650"></i>脚本</span><span><i class="dot" style="background:#8b7eb2"></i>样式 / 布局</span><span><i class="dot" style="background:#55a68c"></i>绘制</span><span><i class="dot" style="background:#aab4ac"></i>其他</span></div></div><div class="chart" id="chart"></div><div class="summary" id="summary"></div></section><section class="panel"><div class="body"><aside><div class="asidehead"><h2>占用主线程的文件</h2></div><div class="caption">按长任务中超过 50 ms 的占用份额排序</div><div class="filelist" id="files"></div></aside><div class="work"><div class="toolbar"><button id="long" class="active">长任务</button><button id="every">全部任务</button><button id="clear">全部文件</button><input id="search" placeholder="搜索文件或域名" aria-label="搜索文件"></div><div class="columns"><span>开始 / 秒</span><span>主要文件 / 工作</span><span class="timecolumn">发生位置</span><span style="text-align:right">任务耗时</span></div><div class="tasks" id="tasks"></div><div class="details" id="details"></div></div></div></section><section class="panel"><div class="head"><h2>LCP · 首屏最大内容绘制</h2><span class="label">本次录制的最后一个候选</span></div><div class="lcpstrip" id="stages"></div><div class="caption">本次录制；各阶段按导航与资源计时拆分。主线程范围仅含顶层页面，低于 1 ms 的任务省略。</div></section></main><script id="data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Math.round(n).toLocaleString(),sec=n=>n==null?'—':(n/1000).toFixed(2),colors={'脚本':'#bd8650','布局':'#8b7eb2','样式':'#8b7eb2','绘制':'#55a68c','HTML':'#6997b1','其他':'#aab4ac'};let end=D.duration,onlyLong=true,file=null,selected=null;
function name(u){if(!u)return '未归因到脚本的工作';try{const a=new URL(u);return decodeURIComponent(a.pathname.split('/').pop()||a.hostname)}catch{return u}}
function path(u){try{const a=new URL(u);return a.hostname+a.pathname}catch{return u}}
function visible(t){return t.start<end}function dominant(t){return t.sources.find(s=>s.url)?.url||''}function workname(t){const kinds={};for(const s of t.sources)for(const[k,v]of Object.entries(s.kinds))kinds[k]=(kinds[k]||0)+v;return Object.entries(kinds).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]).join(' / ')}
function render(){const ts=D.tasks.filter(visible),long=ts.filter(t=>t.duration>50),busy=ts.reduce((n,t)=>n+Math.min(t.duration,end-t.start),0),excess=ts.reduce((n,t)=>n+Math.max(0,Math.min(t.duration,end-t.start)-50),0);$('metrics').innerHTML=[['LCP',sec(D.lcp),'秒'],['主线程占用',sec(busy),'秒'],['长任务',long.length,'个'],['长任务超额占用',fmt(excess),'ms']].map(v=>`<div class="metric"><div class="label">${v[0]}</div><div class="number">${v[1]} <small>${v[2]}</small></div></div>`).join('');$('summary').textContent=`当前范围有 ${long.length} 个长任务，其中 ${long.filter(t=>D.lcp!=null&&t.start<D.lcp).length} 个在 LCP 前开始。点击文件查看关联任务；长任务不等于已确认的加载根因。`;
let bins=Array.from({length:180},()=>({}));for(const t of ts)for(const s of t.segments){const a=s.start,b=Math.min(end,a+s.duration);if(a>=end)continue;for(let i=Math.floor(a/end*180);i<=Math.min(179,Math.floor(b/end*180));i++){const n=Math.max(0,Math.min(b,(i+1)*end/180)-Math.max(a,i*end/180));bins[i][s.kind]=(bins[i][s.kind]||0)+n;}}let svg='<svg viewBox="0 0 1100 105" role="img" aria-label="主线程占用时间线">';for(let i=0;i<=5;i++)svg+=`<line x1="${i*218}" x2="${i*218}" y1="8" y2="78" stroke="#e6ece7"/><text class="tick" x="${i*218}" y="99" text-anchor="${i===5?'end':'start'}">${sec(i*end/5)} s</text>`;bins.forEach((b,i)=>{let y=78;for(const[k,v]of Object.entries(b)){const h=Math.min(68,v/(end/180)*68);y-=h;svg+=`<rect x="${i*1090/180}" y="${y}" width="${1090/180-1}" height="${h}" fill="${colors[k]}"><title>${sec(i*end/180)}s · ${k} ${fmt(v)}ms</title></rect>`}});if(D.lcp!=null&&D.lcp<=end)svg+=`<line x1="${D.lcp/end*1090}" x2="${D.lcp/end*1090}" y1="0" y2="80" stroke="#147650"/><text x="${Math.min(1000,D.lcp/end*1090+6)}" y="12" fill="#147650" font-size="11">LCP ${sec(D.lcp)}s</text>`;$('chart').innerHTML=svg+'</svg>';
const q=$('search').value.toLowerCase();const fs=D.files.filter(f=>f.tasks.some(i=>visible(D.tasks[i]))&&path(f.url).toLowerCase().includes(q));fs.sort((a,b)=>(!a.url)-(!b.url)||b.tail-a.tail);$('files').innerHTML=[...fs.filter(f=>f.url).slice(0,20),...fs.filter(f=>!f.url)].map(f=>{const relevant=f.tasks.map(i=>D.tasks[i]).filter(visible);const sources=relevant.flatMap(t=>t.segments.filter(s=>s.url===f.url&&s.start<end).map(s=>({busy:Math.min(s.duration,end-s.start),tail:Math.max(0,Math.min(end,s.start+s.duration)-Math.max(s.start,t.start+50))})));const total=sources.reduce((n,s)=>n+s.busy,0),tail=sources.reduce((n,s)=>n+s.tail,0);return `<button class="file ${file===f.url?'selected':''}" data-file="${esc(f.url)}"><strong>${esc(name(f.url))}</strong><small>${esc(f.url?new URL(f.url).hostname:'布局、绘制、浏览器内部工作')}</small><div class="filefoot"><span>占用 ${fmt(total)} ms</span><span>超额 ${fmt(tail)} ms</span></div><div class="filebar"><i style="width:${Math.min(100,tail/125*100)}%"></i></div></button>`}).join('')||'<div class="empty">无匹配文件</div>';document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{file=b.dataset.file;selected=null;render()});
let rows=ts.filter(t=>(!onlyLong||t.duration>50)&&(file===null||t.sources.some(s=>s.url===file))&&(!q||t.sources.some(s=>path(s.url).toLowerCase().includes(q))));if(!rows.some(t=>t.id===selected))selected=rows.length?rows.reduce((a,b)=>a.duration>b.duration?a:b).id:null;$('tasks').innerHTML=rows.map(t=>{let u=dominant(t);return `<button class="task ${selected===t.id?'selected':''}" data-task="${t.id}"><span>${sec(t.start)}</span><span class="taskname">${esc(u?name(u):workname(t))}<small>${D.lcp==null?'LCP 未记录':t.start<D.lcp?'LCP 之前':'LCP 之后'} · ${t.sources.filter(s=>s.url).length} 个关联文件</small></span><span class="track"><i class="bar" style="left:${t.start/end*100}%;width:${Math.min(t.duration,end-t.start)/end*100}%;background:${t.duration>50?'#b86645':'#bd8650'}"></i><i class="lcp" style="left:${D.lcp/end*100}%"></i></span><span class="duration">${fmt(t.duration)} ms</span></button>`}).join('')||'<div class="empty">当前范围没有匹配任务<br>可切换“全部任务”或“完整过程”</div>';document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{selected=+b.dataset.task;render()});detail();}
function detail(){const t=D.tasks.find(t=>t.id===selected);if(!t){$('details').innerHTML='';return}const kinds={};for(const s of t.sources)for(const[k,v]of Object.entries(s.kinds))kinds[k]=(kinds[k]||0)+v;$('details').innerHTML=`<div class="detailhead"><div><h2>${sec(t.start)} — ${sec(t.start+t.duration)} s · ${fmt(t.duration)} ms</h2><p class="sub">${D.lcp==null?'未记录 LCP，无法判断先后关系。':t.start>=D.lcp?'发生在 LCP 之后，不是此次 LCP 延迟的原因。':'与 LCP 前的主线程工作有关，不能仅凭时长认定为根因。'}</p></div><span class="badge">${t.duration>50?'超过 50 ms 部分：'+fmt(t.duration-50)+' ms':'普通任务'}</span></div><div class="split">${Object.entries(kinds).map(([k,v])=>`<i style="width:${v/t.duration*100}%;background:${colors[k]}" title="${k} ${fmt(v)}ms"></i>`).join('')}</div><div class="facts">${Object.entries(kinds).map(([k,v])=>`<span><i class="dot" style="background:${colors[k]}"></i>${k} ${fmt(v)} ms</span>`).join('')}</div><h3 style="margin-top:20px">这个任务里，哪些文件在执行</h3>${t.sources.filter(s=>s.busy>=1).map(s=>{const r=D.resources.find(r=>r.url===s.url);return `<div class="source"><div><strong>${esc(name(s.url))}</strong>${s.url?`<div class="path">${esc(path(s.url))}${s.line!=null?' · 行 '+s.line:''}</div>`:''}<div class="sub">${Object.entries(s.kinds).map(([k,v])=>k+' '+fmt(v)+' ms').join(' / ')}${r?`<br>资源请求 ${sec(r.start)} — ${sec(r.start+r.duration)} s${r.cache?' · 缓存命中':''}`:''}</div></div><strong>${fmt(s.busy)} ms</strong></div>`}).join('')}<p class="sub">耗时已去重；低于 1 ms 的文件条目折叠。样式与布局关联到包围它的脚本调用。</p>`;}
$('site').textContent=D.url;$('before').disabled=D.lcp==null;$('stages').innerHTML=D.breakdown.map(b=>`<div><span class="label">${esc(b.name)}</span><strong>${fmt(b.value)} ms</strong></div>`).join('');$('all').onclick=()=>{end=D.duration;$('all').classList.add('active');$('before').classList.remove('active');render()};$('before').onclick=()=>{if(D.lcp==null)return;end=D.lcp;$('before').classList.add('active');$('all').classList.remove('active');render()};$('long').onclick=()=>{onlyLong=true;$('long').classList.add('active');$('every').classList.remove('active');render()};$('every').onclick=()=>{onlyLong=false;$('every').classList.add('active');$('long').classList.remove('active');render()};$('clear').onclick=()=>{file=null;$('search').value='';render()};$('search').oninput=()=>{file=null;render()};render();
</script></body></html>
