name: Publish documentation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository quality gate
        run: make check
      - name: Test site builder
        run: python -m unittest discover -s tests -p test_site.py
      - name: Build static documentation
        run: python tools/build_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload documentation only
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
