name: CI

on:
  push:
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Harness checks
        run: make check
      - name: Tool smoke tests
        run: make test
      - name: Eval harness
        run: make eval-ci

  installability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Guard the consumer-facing contract: the published repository must still be
      # discoverable as an installable skill package.
      - name: skills CLI can enumerate this repository
        run: npx --yes skills@latest add . --list
